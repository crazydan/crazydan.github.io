name: Bug Report
description: Report something broken on the site.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What broke?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Layout
        - Terminal
        - Links
        - Accessibility
        - Performance
        - Deployment
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Safari on iPhone, Chrome on desktop, etc.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Screenshots, console errors, or reproduction steps.
